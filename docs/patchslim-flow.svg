<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PatchSlim reduction workflow</title>
  <desc id="desc">A branch diff is split into protected and reducible changes. PatchSlim tests file and hunk candidates in a temporary worktree, keeps passing candidates, and writes patches plus a report.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .label { font: 700 21px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .detail { font: 500 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .eyebrow { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.6px; fill: #64748b; }
      .arrow-label { font: 700 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <path d="M 32 112 H 1168" stroke="#e2e8f0"/>
  <text x="48" y="55" class="eyebrow">TEST-GUIDED DIFF MINIMIZATION</text>
  <text x="48" y="88" class="label" font-size="26">Keep the behavior. Remove the unnecessary change.</text>

  <g filter="url(#shadow)">
    <rect x="48" y="164" width="190" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="264" y="140" width="214" height="98" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="264" y="264" width="214" height="98" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="522" y="164" width="220" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="786" y="164" width="174" height="150" rx="18" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="1004" y="164" width="148" height="150" rx="18" fill="#faf5ff" stroke="#d8b4fe"/>
  </g>

  <text x="72" y="195" class="eyebrow">INPUT</text>
  <text x="72" y="229" class="label">Branch diff</text>
  <text x="72" y="259" class="detail">merge base → HEAD</text>
  <text x="72" y="285" class="detail">committed changes only</text>

  <text x="288" y="171" class="eyebrow">ALWAYS KEEP</text>
  <text x="288" y="204" class="label">Protected</text>
  <text x="288" y="226" class="detail">tests · CI · manifests</text>

  <text x="288" y="295" class="eyebrow">SEARCH SPACE</text>
  <text x="288" y="328" class="label">Reducible</text>
  <text x="288" y="350" class="detail">source files and hunks</text>

  <text x="546" y="195" class="eyebrow">REDUCER</text>
  <text x="546" y="229" class="label">file → hunk ddmin</text>
  <text x="546" y="259" class="detail">rebuild every candidate</text>
  <text x="546" y="285" class="detail">cache identical states</text>

  <text x="810" y="195" class="eyebrow">EVIDENCE</text>
  <text x="810" y="229" class="label">Oracle</text>
  <text x="810" y="259" class="detail">quick gates</text>
  <text x="810" y="285" class="detail">full validation</text>

  <text x="1028" y="195" class="eyebrow">OUTPUT</text>
  <text x="1028" y="229" class="label">Artifacts</text>
  <text x="1028" y="259" class="detail">apply.patch</text>
  <text x="1028" y="283" class="detail">report.json</text>

  <path d="M 238 239 H 252" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 478 313 H 510" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 742 239 H 774" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 960 239 H 992" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M 872 326 C 872 430, 632 446, 632 328" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="720" y="427" class="arrow-label">failing candidate → restore changes</text>

  <path d="M 371 238 V 252" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="49" y="476" class="detail">Every check runs in an isolated temporary Git worktree. The current checkout is never reset, cleaned, or modified.</text>
</svg>
